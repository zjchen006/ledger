<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>极简记账 · AI理财助手</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        body { background: #f0f4f3; display: flex; justify-content: center; min-height: 100vh; padding-bottom: 40px; }
        .app { max-width: 480px; width: 100%; background: #fff; min-height: 100vh; padding: 20px 16px 120px; box-shadow: 0 0 30px rgba(0,0,0,0.05); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
        .header h1 { font-size: 24px; color: #2d3e3a; }
        .header-actions { display: flex; gap: 8px; }
        .header-actions button { background: #eaf0ee; border: 1px solid #d5deda; border-radius: 30px; padding: 8px 14px; font-size: 13px; color: #2d3e3a; cursor: pointer; font-weight: 500; }

        /* 余额卡片 - 左右布局 */
        .balance-card { background: #f7faf8; border: 1px solid #d5deda; border-radius: 20px; padding: 18px 20px; color: #2d3e3a; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
        .balance-left { flex: 1; }
        .balance-left .label { font-size: 13px; color: #6b7f7a; }
        .balance-left .amount { font-size: 28px; font-weight: 700; margin-top: 4px; color: #2d3e3a; }
        .balance-left .edit-btn { background: #eaf0ee; border: 1px solid #d5deda; border-radius: 30px; padding: 5px 14px; color: #2d3e3a; font-size: 12px; cursor: pointer; margin-top: 10px; }
        .balance-right { display: flex; flex-direction: column; gap: 10px; text-align: right; }
        .balance-stat { display: flex; justify-content: space-between; gap: 20px; font-size: 14px; align-items: center; }
        .balance-stat .stat-label { color: #8fa39e; font-size: 13px; }
        .balance-stat .stat-value { font-weight: 700; font-size: 16px; }

        /* 周期切换器 */
        .period-switcher { display: flex; gap: 10px; margin-bottom: 14px; }
        .period-switcher button { flex: 1; padding: 10px 0; border: none; border-radius: 30px; background: #eaf0ee; color: #6b7f7a; font-size: 15px; font-weight: 500; cursor: pointer; }
        .period-switcher button.active { background: #4a9e8a; color: #fff; }

        .expense { color: #d95b5b; }
        .income { color: #3d9b7a; }

        .month-row { display: flex; justify-content: space-between; align-items: center; background: #f4f8f6; border-radius: 30px; padding: 8px 14px; margin-bottom: 14px; }
        .month-row button { background: none; border: none; font-size: 22px; color: #6b7f7a; cursor: pointer; }
        .month-row .month { font-size: 17px; font-weight: 600; color: #2d3e3a; }
        .tab-bar { display: flex; gap: 10px; margin-bottom: 14px; }
        .tab-bar button { flex: 1; padding: 12px 0; border: none; border-radius: 30px; background: #eaf0ee; color: #6b7f7a; font-size: 15px; font-weight: 500; cursor: pointer; }
        .tab-bar button.active { background: #4a9e8a; color: #fff; }
        .view { display: none; }
        .view.active { display: block; }
        .bill-list { display: flex; flex-direction: column; gap: 8px; }
        .bill-item { display: flex; align-items: center; background: #fafcfb; border: 1px solid #eaf0ee; border-radius: 16px; padding: 12px 14px; cursor: pointer; transition: background .15s; }
        .bill-item:hover { background: #f0f6f4; }
        .bill-icon { width: 38px; height: 38px; background: #eaf0ee; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; margin-right: 12px; }
        .bill-info { flex: 1; }
        .bill-cat { font-size: 15px; font-weight: 600; color: #2d3e3a; }
        .bill-sub { font-size: 12px; color: #8fa39e; }
        .bill-right { display: flex; align-items: center; gap: 6px; }
        .bill-amount { font-weight: 700; font-size: 18px; }
        .bill-delete { background: none; border: none; color: #c0c0c0; font-size: 14px; cursor: pointer; padding: 2px 6px; border-radius: 50%; line-height: 1; transition: all .15s; }
        .bill-delete:hover { color: #d95b5b; background: #fdeaea; }
        .empty-tip { background: #f4f8f6; border: 1px dashed #d5deda; border-radius: 16px; padding: 32px 16px; text-align: center; color: #8fa39e; font-size: 14px; }
        .chart-box { background: #fafcfb; border: 1px solid #eaf0ee; border-radius: 18px; padding: 16px 14px; margin-bottom: 16px; }
        .chart-box h3 { font-size: 15px; color: #2d3e3a; margin-bottom: 12px; text-align: center; }
        .chart-box canvas { max-height: 220px; width: 100% !important; height: auto !important; }

        /* AI */
        .ai-container { background: #fafcfb; border: 1px solid #eaf0ee; border-radius: 20px; padding: 16px; margin-bottom: 16px; }
        .ai-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .ai-header span { font-size: 16px; font-weight: 700; color: #2d3e3a; }
        .ai-header .ai-badge { background: #4a9e8a; color: #fff; border-radius: 30px; padding: 4px 14px; font-size: 12px; }
        .ai-chat { background: #fff; border: 1px solid #eaf0ee; border-radius: 16px; padding: 14px; max-height: 300px; overflow-y: auto; margin-bottom: 10px; display: flex; flex-direction: column; gap: 10px; scroll-behavior: smooth; }
        .msg { max-width: 85%; padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 1.5; word-break: break-word; white-space: pre-line; }
        .msg.user { background: #4a9e8a; color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
        .msg.ai { background: #f0f4f3; color: #2d3e3a; align-self: flex-start; border-bottom-left-radius: 4px; }
        .msg.thinking { color: #8fa39e; font-style: italic; }
        .ai-quick-tasks { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
        .ai-quick-tasks button { background: #eaf0ee; border: 1px solid #d5deda; border-radius: 30px; padding: 5px 14px; font-size: 12px; color: #2d3e3a; cursor: pointer; }
        .ai-input-row { display: flex; gap: 8px; }
        .ai-input-row input { flex: 1; padding: 12px 14px; border: 1px solid #d5deda; border-radius: 16px; font-size: 14px; outline: none; }
        .ai-input-row input:focus { border-color: #4a9e8a; }
        .ai-input-row button { background: #4a9e8a; border: none; border-radius: 16px; padding: 12px 20px; color: #fff; font-weight: 600; font-size: 14px; cursor: pointer; }
        .ai-footer-note { font-size: 11px; color: #8fa39e; text-align: center; margin-top: 6px; }
        .ai-footer-note a { color: #4a9e8a; text-decoration: none; cursor: pointer; }

        .fab { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); max-width: 480px; width: calc(100% - 32px); padding: 16px; background: #4a9e8a; border: none; border-radius: 30px; color: #fff; font-size: 17px; font-weight: 600; box-shadow: 0 8px 24px rgba(74,158,138,0.4); cursor: pointer; z-index: 100; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.35); backdrop-filter: blur(4px); z-index: 200; display: none; justify-content: center; align-items: flex-end; }
        .modal-overlay.show { display: flex; }
        .modal-content { background: #fff; width: 100%; max-width: 480px; border-radius: 28px 28px 0 0; padding: 24px 20px calc(24px + env(safe-area-inset-bottom)); animation: slideUp .25s ease; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
        .modal-header h3 { font-size: 20px; color: #2d3e3a; }
        .modal-close { background: none; border: none; font-size: 24px; color: #8fa39e; cursor: pointer; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; font-weight: 500; color: #6b7f7a; margin-bottom: 6px; }
        .form-group input, .form-group select { width: 100%; padding: 12px 14px; border: 1px solid #d5deda; border-radius: 16px; font-size: 16px; background: #fafcfb; outline: none; }
        .form-group input:focus, .form-group select:focus { border-color: #4a9e8a; background: #fff; }
        .form-row { display: flex; gap: 12px; }
        .form-row .form-group { flex: 1; }
        .btn-save { width: 100%; padding: 14px; background: #4a9e8a; border: none; border-radius: 30px; color: #fff; font-size: 17px; font-weight: 600; cursor: pointer; margin-top: 8px; }
        .settings-item { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px solid #eaf0ee; font-size: 15px; color: #2d3e3a; }
        .settings-item .status-used { color: #4a9e8a; }
        .settings-item .status-idle { color: #8fa39e; }
    </style>
</head>
<body>
    <div class="app">
        <div class="header">
            <h1>💰 极简记账</h1>
            <div class="header-actions">
                <button id="exportBtn">📤 导出</button>
                <button id="settingsBtn">⚙️</button>
            </div>
        </div>

        <div class="tab-bar">
            <button class="active" id="tabList">📋 账单</button>
            <button id="tabStats">📊 统计</button>
        </div>

        <!-- 账单视图 -->
        <div class="view active" id="listView">
            <div class="month-row">
                <button id="prevMonth">‹</button>
                <span class="month" id="monthLabel">2026年8月</span>
                <button id="nextMonth">›</button>
            </div>
            <div id="billListContainer"></div>
        </div>

        <!-- 统计视图 -->
        <div class="view" id="statsView">
            <!-- 余额卡片：左余额，右收支 -->
            <div class="balance-card">
                <div class="balance-left">
                    <div class="label">当前余额</div>
                    <div class="amount" id="balanceDisplay">¥0.00</div>
                    <button class="edit-btn" id="editBalanceBtn">✏️ 修改余额</button>
                </div>
                <div class="balance-right">
                    <div class="balance-stat">
                        <span class="stat-label" id="balanceExpenseLabel">本月支出</span>
                        <span class="stat-value expense" id="balanceExpense">¥0.00</span>
                    </div>
                    <div class="balance-stat">
                        <span class="stat-label" id="balanceIncomeLabel">本月收入</span>
                        <span class="stat-value income" id="balanceIncome">¥0.00</span>
                    </div>
                </div>
            </div>

            <!-- 周期切换器 -->
            <div class="period-switcher">
                <button id="switchMonth" class="active">📆 按月</button>
                <button id="switchYear">📅 按年</button>
            </div>

            <!-- 月份切换行（按月时显示） -->
            <div class="month-row" id="statsMonthRow">
                <button id="statsPrevMonth">‹</button>
                <span class="month" id="statsMonthLabel">2026年8月</span>
                <button id="statsNextMonth">›</button>
            </div>

            <!-- 年份切换行（按年时显示） -->
            <div class="month-row" id="statsYearRow" style="display:none;">
                <button id="statsPrevYear">‹</button>
                <span class="month" id="statsYearLabel">2026年</span>
                <button id="statsNextYear">›</button>
            </div>

            <div class="chart-box">
                <h3>🍩 支出分类占比</h3>
                <canvas id="pieChart"></canvas>
                <div class="empty-tip" id="pieEmpty" style="display:none;">当前周期暂无支出数据</div>
            </div>

            <!-- AI 助手 -->
            <div class="ai-container">
                <div class="ai-header">
                    <span>🤖 AI 理财助手</span>
                    <span class="ai-badge" id="aiBadge">本地免费</span>
                </div>
                <div class="ai-chat" id="aiChat"></div>
                <div class="ai-quick-tasks">
                    <button onclick="sendQuestion('全面分析我的消费')">🔍 全面分析</button>
                    <button onclick="sendQuestion('给我省钱建议')">💡 省钱建议</button>
                    <button onclick="sendQuestion('哪部分花得最多')">📊 超支分析</button>
                    <button onclick="sendQuestion('我的备注透露了什么')">📝 备注透视</button>
                </div>
                <div class="ai-input-row">
                    <input type="text" id="aiInput" placeholder="问我任何理财问题...">
                    <button onclick="handleUserInput()">发送</button>
                </div>
                <div class="ai-footer-note">
                    默认使用内置免费智能引擎
                    <a id="aiSearchLink">🔗 联网搜索</a>
                </div>
            </div>
        </div>

        <button class="fab" id="addBillBtn">＋ 记一笔</button>
    </div>

    <!-- 记一笔/编辑弹窗 -->
    <div class="modal-overlay" id="addModal">
        <div class="modal-content">
            <div class="modal-header"><h3 id="addModalTitle">✏️ 记一笔</h3><button class="modal-close" id="closeAddModal">✕</button></div>
            <form id="billForm">
                <div class="form-row">
                    <div class="form-group"><label>类型</label><select id="inputType"><option value="expense">支出</option><option value="income">收入</option></select></div>
                    <div class="form-group"><label>金额 (¥)</label><input type="number" id="inputAmount" placeholder="0.00" step="0.01" min="0" inputmode="decimal" required></div>
                </div>
                <div class="form-group"><label>分类</label><select id="inputCategory"></select></div>
                <div class="form-group"><label>日期</label><input type="date" id="inputDate" required></div>
                <div class="form-group"><label>备注（可选）</label><input type="text" id="inputNote" placeholder="例：打车去公司、买了猫粮等"></div>
                <button type="submit" class="btn-save" id="saveBillBtn">✅ 保存</button>
            </form>
        </div>
    </div>

    <!-- 修改余额弹窗 -->
    <div class="modal-overlay" id="balanceModal">
        <div class="modal-content">
            <div class="modal-header"><h3>✏️ 修改当前余额</h3><button class="modal-close" id="closeBalanceModal">✕</button></div>
            <div class="form-group"><label>余额 (¥)</label><input type="number" id="balanceInput" placeholder="0.00" step="0.01" inputmode="decimal"></div>
            <button class="btn-save" id="saveBalanceBtn">✅ 保存余额</button>
        </div>
    </div>

    <!-- 设置弹窗 -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal-content">
            <div class="modal-header"><h3>⚙️ AI 设置</h3><button class="modal-close" id="closeSettingsModal">✕</button></div>

            <div class="form-group">
                <label>选择 AI 引擎</label>
                <select id="aiEngine">
                    <option value="local" selected>本地免费智能（推荐）</option>
                    <option value="deepseek">DeepSeek（需注册免费Key）</option>
                    <option value="openai">OpenAI 兼容（付费或中转）</option>
                </select>
            </div>

            <div id="deepseekSettings" style="display:none;">
                <div class="form-group"><label>API Key (必填)</label><input type="password" id="deepseekKey" placeholder="sk-..."></div>
                <div style="font-size:12px; color:#8fa39e; margin-bottom:8px;">注册地址：platform.deepseek.com，新用户有免费额度</div>
            </div>

            <div id="openaiSettings" style="display:none;">
                <div class="form-group"><label>API Base URL</label><input type="text" id="openaiBase" placeholder="https://api.openai.com/v1/chat/completions"></div>
                <div class="form-group"><label>API Key</label><input type="password" id="openaiKey" placeholder="sk-..."></div>
                <div class="form-group"><label>模型名称</label><input type="text" id="openaiModel" placeholder="gpt-3.5-turbo"></div>
            </div>

            <button class="btn-save" id="saveSettingsBtn">✅ 保存设置</button>
            <div style="font-size:12px; color:#8fa39e; margin-top:12px; line-height:1.6;">💡 默认本地智能完全免费、无需Key、不联网也能分析你的账单。</div>
        </div>
    </div>

    <script>
        // ========================================
        // 分类定义
        // ========================================
        const EXPENSE_CATEGORIES = ['餐饮', '交通', '居住', '网购', '医疗', '运动锻炼', '美容', '娱乐', '通讯', '教育', '人情', '宠物', '其他'];
        const INCOME_CATEGORIES = ['工资', '奖金', '兼职', '理财收益', '退款', '红包', '其他'];

        // ========================================
        // 种子数据
        // ========================================
        const SEED_DATA = {
            balance: 1306.48,
            currentMonth: '2026-08',
            bills: [
                { id: 1, type: "expense", category: "餐饮", amount: 8.05, note: "无备注", date: "2026-07-26" },
                { id: 2, type: "expense", category: "交通", amount: 49.9, note: "31次小电驴。", date: "2026-07-26" },
                { id: 3, type: "expense", category: "餐饮", amount: 22.8, note: "游完泳吃面包。", date: "2026-07-26" },
                { id: 4, type: "expense", category: "餐饮", amount: 9.85, note: "买了几个鸡蛋面包。", date: "2026-07-26" },
                { id: 5, type: "expense", category: "网购", amount: 71.02, note: "泳裤", date: "2026-07-27" },
                { id: 6, type: "income", category: "退款", amount: 67.1, note: "上次泳裤不合身", date: "2026-07-28" },
                { id: 7, type: "expense", category: "餐饮", amount: 14.8, note: "双皮奶", date: "2026-07-28" },
                { id: 8, type: "expense", category: "餐饮", amount: 1.9, note: "面包", date: "2026-07-28" },
                { id: 9, type: "expense", category: "通讯", amount: 5, note: "DeepSeekv4", date: "2026-07-29" },
                { id: 10, type: "expense", category: "餐饮", amount: 30.33, note: "无备注", date: "2026-07-31" },
                { id: 11, type: "expense", category: "网购", amount: 28.13, note: "泳帽", date: "2026-07-31" },
                { id: 12, type: "expense", category: "医疗", amount: 96, note: "艾灸", date: "2026-08-01" },
                { id: 13, type: "expense", category: "运动锻炼", amount: 400, note: "游泳", date: "2026-08-01" },
                { id: 14, type: "expense", category: "医疗", amount: 114, note: "针灸", date: "2026-08-01" },
                { id: 15, type: "expense", category: "美容", amount: 86, note: "推拿", date: "2026-08-01" },
                { id: 16, type: "expense", category: "医疗", amount: 382.4, note: "无备注", date: "2026-08-01" },
                { id: 17, type: "expense", category: "餐饮", amount: 59, note: "榴莲", date: "2026-08-01" }
            ]
        };

        // ========================================
        // 数据存取
        // ========================================
        const STORAGE_KEY = 'smart_bookkeeping_v2';
        const SETTINGS_KEY = 'ai_settings_v2';

        function loadData() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) { const parsed = JSON.parse(raw); if (parsed && parsed.bills !== undefined && typeof parsed.balance === 'number') return parsed; }
            } catch (e) {}
            return JSON.parse(JSON.stringify(SEED_DATA));
        }
        function saveData() { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }

        function loadSettings() {
            try {
                const raw = localStorage.getItem(SETTINGS_KEY);
                if (raw) return JSON.parse(raw);
            } catch (e) {}
            return {
                engine: 'local',
                deepseekKey: '',
                openaiBase: 'https://api.openai.com/v1/chat/completions',
                openaiKey: '',
                openaiModel: 'gpt-3.5-turbo'
            };
        }
        function saveSettings() { localStorage.setItem(SETTINGS_KEY, JSON.stringify(aiSettings)); }

        let data = loadData();
        let aiSettings = loadSettings();

        // ========================================
        // 状态变量
        // ========================================
        if (!data.currentMonth) data.currentMonth = getTodayMonth();
        let currentMonth = data.currentMonth;
        let currentYear = currentMonth.substring(0, 4);
        let statsMode = 'month'; // 'month' 或 'year'
        let editingBillId = null; // 当前编辑的账单ID

        // ========================================
        // 工具函数
        // ========================================
        function getTodayMonth() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }
        function getTodayStr() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
        function formatMoney(val) { return '¥' + Number(val).toFixed(2); }
        function getMonthLabel(monthStr) { const p = monthStr.split('-'); return p[0] + '年' + p[1] + '月'; }
        function escapeHtml(str) { if (!str) return ''; return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
        function categoryIcon(cat) {
            const icons = {'餐饮':'🍜','交通':'🚌','居住':'🏠','网购':'🛍️','医疗':'🏥','运动锻炼':'🏃','美容':'💄','娱乐':'🎮','通讯':'📱','教育':'📚','人情':'🎁','宠物':'🐱','其他':'📦','工资':'💼','奖金':'🧧','兼职':'💻','理财收益':'📈','退款':'↩️','红包':'🧧'};
            return icons[cat] || '📌';
        }

        // 获取当前统计周期
        function getStatsPeriod() {
            if (statsMode === 'year') {
                const y = currentYear;
                return {
                    type: 'year', value: y, label: y + '年',
                    bills: data.bills.filter(b => b.date.startsWith(y + '-'))
                };
            } else {
                const m = currentMonth;
                return {
                    type: 'month', value: m, label: getMonthLabel(m),

        function renderBillList(monthBills) {
            const container = document.getElementById('billListContainer');
            const list = [...monthBills].sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
            if (list.length === 0) { container.innerHTML = `<div class="empty-tip">✨ 本月暂无记录<br><span style="font-size:13px;">点下方「记一笔」开始记账</span></div>`; return; }
            let html = '<div class="bill-list">';
            list.forEach(b => {
                const cls = b.type === 'expense' ? 'expense' : 'income';
                const sign = b.type === 'expense' ? '-' : '+';
                const note = (b.note && b.note !== '无备注') ? ' · ' + escapeHtml(b.note) : '';
                html += `<div class="bill-item" onclick="editBill(${b.id})">`;
                html += `<div class="bill-icon">${categoryIcon(b.category)}</div>`;
                html += `<div class="bill-info"><div class="bill-cat">${escapeHtml(b.category)}</div><div class="bill-sub">${b.date}${note}</div></div>`;
                html += `<div class="bill-right">`;
                html += `<div class="bill-amount ${cls}">${sign}${Number(b.amount).toFixed(2)}</div>`;
                html += `<button class="bill-delete" onclick="event.stopPropagation(); deleteBill(${b.id})" title="删除">✕</button>`;
                html += `</div>`;
                html += '</div>';
            });
            html += '</div>';
            container.innerHTML = html;
        }

        // ========================================
        // 图表
        // ========================================
        let pieChart = null;
        function renderStats(bills) {
            const categoryMap = {};
            let totalExpense = 0;
            bills.forEach(b => { if (b.type === 'expense') { categoryMap[b.category] = (categoryMap[b.category]||0) + b.amount; totalExpense += b.amount; } });

            const ctx = document.getElementById('pieChart');
            const emptyTip = document.getElementById('pieEmpty');
            if (pieChart) { pieChart.destroy(); pieChart = null; }
            if (totalExpense === 0) { ctx.style.display = 'none'; emptyTip.style.display = 'block'; }
            else {
                ctx.style.display = 'block'; emptyTip.style.display = 'none';
                const labels = Object.keys(categoryMap);
                const values = labels.map(l => Math.round(categoryMap[l] * 100) / 100);
                const colors = ['#4a9e8a','#e6b85c','#d95b5b','#6bb5a0','#8cccb8','#e88b8b','#7a9e8a','#aad0c0','#c0a050','#5a9eb0','#b07a9e','#7a7a9e','#9e9e7a'];
                pieChart = new Chart(ctx, {
                    type: 'doughnut',
                    data: { labels, datasets: [{ data: values, backgroundColor: colors.slice(0, labels.length), borderWidth: 2, borderColor: '#fff' }] },
                    options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { position: 'bottom', labels: { font: { size: 11 }, boxWidth: 14, padding: 8 } }, tooltip: { callbacks: { label: function(c) { const total = c.dataset.data.reduce((a,b)=>a+b,0); const pct = ((c.parsed / total) * 100).toFixed(1); return ` ${c.label}: ¥${c.parsed} (${pct}%)`; } } } } }
                });
            }
        }

        // ========================================
        // 本地智能引擎
        // ========================================
        function getPeriodAnalysis() {
            const period = getStatsPeriod();
            const expenseBills = period.bills.filter(b => b.type === 'expense');
            const incomeBills = period.bills.filter(b => b.type === 'income');
            let totalExpense = 0, totalIncome = 0;
            let categoryMap = {};
            let noteList = [];
            expenseBills.forEach(b => { totalExpense += b.amount; categoryMap[b.category] = (categoryMap[b.category]||0) + b.amount; if (b.note && b.note !== '无备注') noteList.push({ amount: b.amount, cat: b.category, note: b.note, date: b.date }); });
            incomeBills.forEach(b => totalIncome += b.amount);
            return { period, expenseBills, incomeBills, totalExpense, totalIncome, categoryMap, noteList, balance: data.balance };
        }

        function addMessage(role, text) {
            const chat = document.getElementById('aiChat');
            const msg = document.createElement('div');
            msg.className = 'msg ' + role;
            msg.textContent = text;
            chat.appendChild(msg);
            chat.scrollTop = chat.scrollHeight;
        }
        function showThinking() {
            const chat = document.getElementById('aiChat');
            const msg = document.createElement('div');
            msg.className = 'msg thinking'; msg.id = 'thinkingMsg'; msg.textContent = '🤔 正在分析中...';
            chat.appendChild(msg); chat.scrollTop = chat.scrollHeight;
        }
        function removeThinking() { const el = document.getElementById('thinkingMsg'); if (el) el.remove(); }

        async function handleUserInput() {
            const input = document.getElementById('aiInput');
            const text = input.value.trim();
            if (!text) return;
            input.value = '';
            await sendQuestion(text);
        }

        async function sendQuestion(question) {
            if (!question.trim()) return;
            addMessage('user', question);
            showThinking();

            let answer = null;
            if (aiSettings.engine !== 'local') {
                answer = await callOnlineAI(question);
            }
            if (!answer) {
                setTimeout(() => { removeThinking(); addMessage('ai', localAI(question)); }, 300);
            } else {
                removeThinking(); addMessage('ai', answer);
            }
        }

        async function callOnlineAI(question) {
            try {
                let apiBase, apiKey, apiModel;
                if (aiSettings.engine === 'deepseek') {
                    apiBase = 'https://api.deepseek.com/v1/chat/completions';
                    apiKey = aiSettings.deepseekKey;
                    apiModel = 'deepseek-chat';
                } else {
                    apiBase = aiSettings.openaiBase;
                    apiKey = aiSettings.openaiKey;
                    apiModel = aiSettings.openaiModel;
                }
                if (!apiKey) return null;
                const messages = [{ role: 'system', content: '你是一位个人理财顾问。请根据以下消费数据给出针对性建议：\n' + getContextForAI() }, { role: 'user', content: question }];
                const response = await fetch(apiBase, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + apiKey },
                    body: JSON.stringify({ model: apiModel, messages, temperature: 0.7 })
                });
                if (!response.ok) return null;
                const json = await response.json();
                return json.choices[0].message.content;
            } catch (e) { return null; }
        }

        function getContextForAI() {
            const a = getPeriodAnalysis();
            let context = `当前周期：${a.period.label}\n当前余额：¥${data.balance}\n`;
            context += `支出去分类：\n`;
            for (const [cat, amount] of Object.entries(a.categoryMap)) context += `- ${cat}: ¥${amount}\n`;
            context += `\n收入分类：\n`;
            a.incomeBills.forEach(b => context += `- ${b.category}: ¥${b.amount}\n`);
            context += `\n备注明细：\n`;
            a.noteList.forEach(n => context += `- ${n.date} ${n.cat} ¥${n.amount} 备注:${n.note}\n`);
            return context;
        }

        // 统计视图内的月份切换
        function changeStatsMonth(delta) {
            const [year, month] = currentMonth.split('-').map(Number);
            let newYear = year, newMonth = month + delta;
            if (newMonth > 12) { newMonth = 1; newYear++; }
            if (newMonth < 1) { newMonth = 12; newYear--; }
            currentMonth = newYear + '-' + String(newMonth).padStart(2, '0');
            currentYear = String(newYear);
            data.currentMonth = currentMonth;
            saveData();
            render();
        }
        document.getElementById('statsPrevMonth').addEventListener('click', () => changeStatsMonth(-1));
        document.getElementById('statsNextMonth').addEventListener('click', () => changeStatsMonth(1));

        // 统计视图内的年份切换
        function changeStatsYear(delta) {
            let y = parseInt(currentYear) + delta;
            currentYear = String(y);
            const m = currentMonth.split('-')[1] || '01';
            currentMonth = currentYear + '-' + m;
            data.currentMonth = currentMonth;
            saveData();
            render();
        }
        document.getElementById('statsPrevYear').addEventListener('click', () => changeStatsYear(-1));
        document.getElementById('statsNextYear').addEventListener('click', () => changeStatsYear(1));

            if (newMonth > 12) { newMonth = 1; newYear++; }
            if (newMonth < 1) { newMonth = 12; newYear--; }

        function openAddModal(billId = null) {
            document.getElementById('billForm').reset();
            editingBillId = billId;

            if (billId) {
                const bill = data.bills.find(b => b.id === billId);
                if (!bill) { editingBillId = null; return; }
                document.getElementById('inputType').value = bill.type;
                updateCategorySelect();
                const categorySelect = document.getElementById('inputCategory');
                if (Array.from(categorySelect.options).some(opt => opt.value === bill.category)) {
                    categorySelect.value = bill.category;
                }
                document.getElementById('inputAmount').value = bill.amount;
                document.getElementById('inputDate').value = bill.date;
                document.getElementById('inputNote').value = bill.note === '无备注' ? '' : bill.note;
                document.getElementById('addModalTitle').textContent = '✏️ 编辑账单';
                document.getElementById('saveBillBtn').textContent = '✅ 更新';
            } else {
                document.getElementById('inputType').value = 'expense';
                updateCategorySelect();
                document.getElementById('inputDate').value = getTodayStr();
                document.getElementById('inputNote').value = '';
                document.getElementById('addModalTitle').textContent = '✏️ 记一笔';
                document.getElementById('saveBillBtn').textContent = '✅ 保存';
            }
            document.getElementById('addModal').classList.add('show');
        }

            document.getElementById('addModal').classList.remove('show');

            document.getElementById('saveBillBtn').textContent = '✅ 保存';

        function deleteBill(id) {
            const bill = data.bills.find(b => b.id === id);
            if (!bill) return;
            if (!confirm(`确定删除这笔 ${bill.category} ${bill.type === 'expense' ? '支出' : '收入'} 吗？`)) return;

            // 恢复余额
            if (bill.type === 'expense') data.balance = Math.round((data.balance + bill.amount) * 100) / 100;
            else data.balance = Math.round((data.balance - bill.amount) * 100) / 100;

            // 删除记录
            data.bills = data.bills.filter(b => b.id !== id);
            saveData();
            render();
        }

        document.getElementById('addBillBtn').addEventListener('click', function() { openAddModal(); });
        document.getElementById('closeAddModal').addEventListener('click', closeAddModal);
        document.getElementById('addModal').addEventListener('click', function(e) { if (e.target === this) closeAddModal(); });
        document.getElementById('inputType').addEventListener('change', updateCategorySelect);

        document.getElementById('billForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const type = document.getElementById('inputType').value;
            const amount = parseFloat(document.getElementById('inputAmount').value);
            const category = document.getElementById('inputCategory').value;
            const date = document.getElementById('inputDate').value;
            const note = document.getElementById('inputNote').value.trim() || '无备注';
            if (!amount || amount <= 0) { alert('请输入有效金额'); return; }
            if (!category) { alert('请选择分类'); return; }
            if (!date) { alert('请选择日期'); return; }

            if (editingBillId) {
                // 找到原账单
                const oldBill = data.bills.find(b => b.id === editingBillId);
                if (!oldBill) { editingBillId = null; closeAddModal(); return; }

                // 先恢复旧记录对余额的影响
                if (oldBill.type === 'expense') data.balance = Math.round((data.balance + oldBill.amount) * 100) / 100;
                else data.balance = Math.round((data.balance - oldBill.amount) * 100) / 100;

                // 再应用新记录对余额的影响
                if (type === 'expense') data.balance = Math.round((data.balance - amount) * 100) / 100;
                else data.balance = Math.round((data.balance + amount) * 100) / 100;

                // 更新数据
                oldBill.type = type;
                oldBill.category = category;
                oldBill.amount = Math.round(amount * 100) / 100;
                oldBill.date = date;
                oldBill.note = note;

                currentMonth = date.substring(0, 7);
                currentYear = currentMonth.substring(0, 4);
                data.currentMonth = currentMonth;
                saveData();
                closeAddModal();
                render();
                switchView('list');
            } else {
                // 新增账单
                const id = data.bills.length > 0 ? Math.max(...data.bills.map(b => b.id)) + 1 : 1;
                data.bills.push({ id, type, category, amount: Math.round(amount * 100) / 100, date, note });
                if (type === 'expense') data.balance = Math.round((data.balance - amount) * 100) / 100;
                else data.balance = Math.round((data.balance + amount) * 100) / 100;
                currentMonth = date.substring(0, 7);
                currentYear = currentMonth.substring(0, 4);
                data.currentMonth = currentMonth;
                saveData(); closeAddModal(); render(); switchView('list');
            }
        });

        // ========================================
        // 修改余额
        // ========================================
        function openBalanceModal() { document.getElementById('balanceInput').value = Number(data.balance).toFixed(2); document.getElementById('balanceModal').classList.add('show'); }
        function closeBalanceModal() { document.getElementById('balanceModal').classList.remove('show'); }
        document.getElementById('editBalanceBtn').addEventListener('click', openBalanceModal);
        document.getElementById('closeBalanceModal').addEventListener('click', closeBalanceModal);
        document.getElementById('balanceModal').addEventListener('click', function(e) { if (e.target === this) closeBalanceModal(); });
        document.getElementById('saveBalanceBtn').addEventListener('click', function() {
            const val = parseFloat(document.getElementById('balanceInput').value);
            if (isNaN(val)) { alert('请输入有效金额'); return; }
            data.balance = Math.round(val * 100) / 100;
            saveData(); closeBalanceModal(); render();
        });

        // ========================================
        // 导出
        // ========================================
        document.getElementById('exportBtn').addEventListener('click', function() {
            const payload = { balance: data.balance, bills: data.bills, currentMonth: currentMonth, exportDate: new Date().toISOString() };
            const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = '记账备份_' + getTodayStr() + '.json';
            document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
        });

        // ========================================
        // 设置
        // ========================================
        function openSettings() {
            document.getElementById('aiEngine').value = aiSettings.engine;
            document.getElementById('deepseekKey').value = aiSettings.deepseekKey || '';
            document.getElementById('openaiBase').value = aiSettings.openaiBase || 'https://api.openai.com/v1/chat/completions';
            document.getElementById('openaiKey').value = aiSettings.openaiKey || '';
            document.getElementById('openaiModel').value = aiSettings.openaiModel || 'gpt-3.5-turbo';
            toggleEngineFields();
            document.getElementById('settingsModal').classList.add('show');
        }
        function closeSettings() { document.getElementById('settingsModal').classList.remove('show'); }
        document.getElementById('settingsBtn').addEventListener('click', openSettings);
        document.getElementById('closeSettingsModal').addEventListener('click', closeSettings);
        document.getElementById('settingsModal').addEventListener('click', function(e) { if (e.target === this) closeSettings(); });

        function toggleEngineFields() {
            const engine = document.getElementById('aiEngine').value;
            document.getElementById('deepseekSettings').style.display = (engine === 'deepseek') ? 'block' : 'none';
            document.getElementById('openaiSettings').style.display = (engine === 'openai') ? 'block' : 'none';
        }
        document.getElementById('aiEngine').addEventListener('change', toggleEngineFields);

        document.getElementById('saveSettingsBtn').addEventListener('click', function() {
            const engine = document.getElementById('aiEngine').value;
            aiSettings.engine = engine;
            aiSettings.deepseekKey = document.getElementById('deepseekKey').value.trim();
            aiSettings.openaiBase = document.getElementById('openaiBase').value.trim();
            aiSettings.openaiKey = document.getElementById('openaiKey').value.trim();
            aiSettings.openaiModel = document.getElementById('openaiModel').value.trim();
            saveSettings();
            updateAIBadge();
            closeSettings();
            alert('✅ 设置已保存');
        });

        // 联网搜索链接
        document.getElementById('aiSearchLink').addEventListener('click', function() {
            const period = getStatsPeriod();
            const query = period.label + '记账 省钱 理财建议';
            window.open('https://www.bing.com/search?q=' + encodeURIComponent(query), '_blank');
        });

        // 键盘发送
        document.getElementById('aiInput').addEventListener('keydown', function(e) { if (e.key === 'Enter') handleUserInput(); });

        // 启动
        render();
        initAI();
    </script>
</body>
</html>
